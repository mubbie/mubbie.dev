<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="orb-green" cx="0.15" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-blue" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .line   { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 96px; font-weight: 700; letter-spacing: -0.01em; }
      .year   { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 96px; font-weight: 700; letter-spacing: 0.02em; }
      .footer { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 26px; letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0c"/>
  <rect width="1200" height="630" fill="url(#orb-green)"/>
  <rect width="1200" height="630" fill="url(#orb-blue)"/>

  <!-- Hero text, two lines, left-justified -->
  <text class="line" x="80" y="280" fill="#e8e8ed">⚽ football is life</text>
  <text class="year" x="80" y="400" fill="#22c55e">2026</text>

  <!-- Footer URL, bottom left -->
  <text class="footer" x="80" y="580" fill="#8a8a96">mubbie.dev/wc-2026</text>
</svg>
