name: Snapshot WC 2026 results

# Pulls https://mubbie.dev/api/wc-results into public/data/wc-2026-results.json
# so the static fallback layer stays within ~6 hours of reality. The Worker is
# already the live source of truth — this just keeps the disaster-recovery
# snapshot fresh in git without manual effort.

on:
  schedule:
    # Every 6 hours at :00 UTC (00, 06, 12, 18)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest results from /api/wc-results
        id: fetch
        run: |
          set -euo pipefail
          curl -sf --retry 3 --max-time 30 \
            https://mubbie.dev/api/wc-results \
            | jq '.' > public/data/wc-2026-results.json.new
          # Sanity check that we got the expected shape from the Worker.
          jq -e 'has("knockout") and has("groupStage")' \
            public/data/wc-2026-results.json.new > /dev/null

      - name: Detect substantive changes (ignore fetchedAt)
        id: diff
        run: |
          OLD=$(jq -S 'del(.fetchedAt)' public/data/wc-2026-results.json 2>/dev/null || echo "{}")
          NEW=$(jq -S 'del(.fetchedAt)' public/data/wc-2026-results.json.new)
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm public/data/wc-2026-results.json.new
          else
            mv public/data/wc-2026-results.json.new public/data/wc-2026-results.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize what's new
        id: summary
        run: |
          set -euo pipefail
          FILE=public/data/wc-2026-results.json
          GROUPS_GRADED=$(jq '[.groupStage | to_entries[] | select(.value["1st"])] | length' "$FILE")
          KNOCKOUT_FINISHED=$(jq '[
            .knockout | to_entries[] | .value | to_entries[] | .value | select(.winner)
          ] | length' "$FILE")
          {
            echo "## WC 2026 snapshot"
            echo ""
            echo "- changed: \`${{ steps.diff.outputs.changed }}\`"
            echo "- groups graded: \`$GROUPS_GRADED / 12\`"
            echo "- knockout matches with a winner: \`$KNOCKOUT_FINISHED / 31\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "groups=$GROUPS_GRADED" >> "$GITHUB_OUTPUT"
          echo "knockout=$KNOCKOUT_FINISHED" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/wc-2026-results.json
          git commit -m "Snapshot WC 2026 results (${{ steps.summary.outputs.groups }}/12 groups, ${{ steps.summary.outputs.knockout }}/31 knockouts)"
          git push
