name: Snapshot WC 2026 results

on:
  schedule:
    # Every 6 hours at :00 UTC (00, 06, 12, 18)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest results from /api/wc-results
        run: |
          set -euo pipefail
          curl -sf --retry 3 --max-time 30 \
            https://mubbie.dev/api/wc-results \
            | jq '.' > public/data/wc-2026-results.json.new
          # Sanity check that we got the expected shape
          jq -e '.knockout' public/data/wc-2026-results.json.new > /dev/null

      - name: Skip if only fetchedAt changed
        id: diff
        run: |
          OLD=$(jq -S 'del(.fetchedAt)' public/data/wc-2026-results.json 2>/dev/null || echo "{}")
          NEW=$(jq -S 'del(.fetchedAt)' public/data/wc-2026-results.json.new)
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm public/data/wc-2026-results.json.new
          else
            mv public/data/wc-2026-results.json.new public/data/wc-2026-results.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/wc-2026-results.json
          git commit -m "Snapshot WC 2026 results"
          git push
